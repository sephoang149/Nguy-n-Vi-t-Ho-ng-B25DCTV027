<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Máy tính đơn giản</title>
    <style>
        body {
            background-color: #f2f2f2;
        }

        .may-tinh {
            width: 260px;
            margin: 50px auto;
            padding: 20px;
            background-color: white;
            border: 1px ;
            border-radius: 8px;
        }

        #man-hinh {
            width: 100%;
            box-sizing: border-box;
            margin-bottom: 10px;
            padding: 10px;
            font-size: 24px;
            text-align: right;
        }

        .cac-nut {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 8px;
        }

        button {
            padding: 12px;
            font-size: 18px;
        
        }

        .nut-clear {
            grid-column: span 4;
        }
    </style>
</head>
<body>
    <div class="may-tinh">
        <input id="man-hinh" type="text" value="0" >

        <div class="cac-nut">
            <button class="so">7</button>
            <button class="so">8</button>
            <button class="so">9</button>
            <button class="phep-tinh">/</button>
            <button class="so">4</button>
            <button class="so">5</button>
            <button class="so">6</button>
            <button class="phep-tinh">*</button>
            <button class="so">1</button>
            <button class="so">2</button>
            <button class="so">3</button>
            <button class="phep-tinh">-</button>
            <button class="so">0</button>
            <button id="dau-cham">.</button>
            <button class="phep-tinh">+</button>
            <button id="bang">=</button>
            <button class="nut-clear" id="clear">Clear</button>
        </div>
    </div>

    <script>
        const manHinh = document.getElementById('man-hinh');
        const cacNutSo = document.querySelectorAll('.so');
        const cacNutPhepTinh = document.querySelectorAll('.phep-tinh');
        const nutBang = document.getElementById('bang');
        const nutClear = document.getElementById('clear');
        const nutDauCham = document.getElementById('dau-cham');

        cacNutSo.forEach(function (nut) {
            nut.addEventListener('click', function () {
                if (manHinh.value === '0') {
                    manHinh.value = nut.innerText;
                } else {
                    manHinh.value += nut.innerText;
                }
            });
        });

        cacNutPhepTinh.forEach(function (nut) {
            nut.addEventListener('click', function () {
                manHinh.value += nut.innerText;
            });
        });

        nutDauCham.addEventListener('click', function () {
            const soCuoi = manHinh.value.split(/[+\-*/]/).pop();

            if (!soCuoi.includes('.')) {
                manHinh.value += '.';
            }
        });

        nutBang.addEventListener('click', function () {
            try {
                manHinh.value = eval(manHinh.value);
            } catch (loi) {
                manHinh.value = 'Lỗi';
            }
        });

        nutClear.addEventListener('click', function () {
            manHinh.value = '0';
        });
    </script>
</body>
</html>
